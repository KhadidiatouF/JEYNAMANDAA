<div
  class="fixed left-0 right-0 top-0 z-50 transition-colors duration-300"
  [class.bg-transparent]="!isScrolled()"
  [class.bg-white]="isScrolled()"
  [class.text-white]="!isScrolled()"
  [class.text-black]="isScrolled()"
  [class.shadow-sm]="isScrolled()"
>
  <p class="mb-0 bg-black py-1.5 text-center text-[10px] font-semibold uppercase text-white max-[760px]:hidden">
    Livraison disponible partout au Sénégal · Découvrez la nouvelle capsule
  </p>
  <header
    class="grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-y-4 px-8 py-5 text-[10px] font-semibold uppercase max-[760px]:px-5 max-[760px]:py-4"
  >
    <nav class="flex items-center justify-self-start gap-6 max-[760px]:hidden" aria-label="Navigation principale">
      <a class="hover:opacity-70" href="#catalogue">Shop</a>
      <a class="hover:opacity-70" href="#femme">Capsule</a>
      <a class="hover:opacity-70" href="#homme">Éditorial</a>
      <a class="hover:opacity-70" href="#contact">Contact</a>
    </nav>
    <button
      class="hidden h-8 w-8 place-items-center text-xl leading-none max-[760px]:col-start-1 max-[760px]:row-start-1 max-[760px]:inline-grid"
      type="button"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? '×' : '☰' }}
    </button>
    <a class="col-start-2 row-start-1 justify-self-center whitespace-nowrap text-[24px] font-bold max-[760px]:text-[18px]" href="#top" aria-label="Accueil Jeynamandaa">JEYNAMANDAA</a>
    <div class="col-start-3 row-start-1 flex items-center justify-self-end gap-5 max-[760px]:gap-3">
      <button class="text-lg leading-none" type="button" aria-label="Rechercher">⌕</button>
      <button class="text-lg leading-none" type="button" aria-label="Panier">♡</button>
      <button class="text-lg leading-none" type="button" aria-label="Compte">□</button>
    </div>
    @if (menuOpen()) {
      <nav
        id="mobile-menu"
        class="col-span-3 row-start-2 grid gap-4 border-t border-current/20 px-4 py-5 text-center text-xs max-[760px]:bg-black/70"
        [class.bg-white]="isScrolled()"
        aria-label="Navigation mobile"
      >
        <a class="hover:opacity-70" href="#catalogue" (click)="closeMenu()">Shop</a>
        <a class="hover:opacity-70" href="#femme" (click)="closeMenu()">Capsule</a>
        <a class="hover:opacity-70" href="#homme" (click)="closeMenu()">Éditorial</a>
        <a class="hover:opacity-70" href="#contact" (click)="closeMenu()">Contact</a>
      </nav>
    }
  </header>
</div>
