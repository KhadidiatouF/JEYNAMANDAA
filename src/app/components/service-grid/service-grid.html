<section class="grid grid-cols-4 bg-white max-[900px]:grid-cols-2 max-[640px]:grid-cols-1" aria-label="Services boutique">
  @for (service of services(); track service.title) {
    <article class="border-r border-black/10 p-8 text-center last:border-r-0 max-[640px]:border-r-0 max-[640px]:border-b max-[640px]:border-black/10">
      <h3 class="text-[11px] font-extrabold uppercase tracking-[0.08em]">{{ service.title }}</h3>
      <p class="mb-0 text-xs text-black/50">{{ service.detail }}</p>
    </article>
  }
</section>
