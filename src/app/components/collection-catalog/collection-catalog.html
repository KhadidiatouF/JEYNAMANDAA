<section
  class="bg-white px-5 py-10"
  aria-labelledby="catalogue-title"
>
  <div class="mx-auto mb-6 max-w-[92rem] text-center">
    <h2 id="catalogue-title" class="mb-0 text-sm font-extrabold uppercase tracking-[0.08em]">
      Shop the Legacy Capsule
    </h2>
  </div>

  <div class="mx-auto grid max-w-[92rem] grid-cols-4 gap-4 max-[900px]:grid-cols-2 max-[560px]:grid-cols-1">
    @for (collection of collections(); track collection.name) {
      <article class="group bg-white">
        <div class="relative aspect-[3/4] overflow-hidden bg-[#f6f6f6]">
          <span class="absolute left-3 top-3 z-10 text-[9px] font-extrabold uppercase tracking-[0.08em]">New</span>
          <img class="block h-full w-full object-cover object-top transition duration-500 group-hover:scale-[1.035]" [src]="collection.image" [alt]="collection.imageAlt" />
        </div>
        <div class="px-1 py-4 text-center">
          <h3 class="mb-2 text-[11px] font-bold">{{ collection.name }}</h3>
          <p class="mb-3 text-[10px] text-black/50">Capsule Baaxantal</p>
          <div class="flex justify-center gap-4 text-[9px] uppercase text-black/70">
            <span>XS</span>
            <span>S</span>
            <span>M</span>
            <span>L</span>
            <span>XL</span>
          </div>
        </div>
      </article>
    }
  </div>

  <div class="mx-auto mt-10 h-px max-w-[46rem] bg-black"></div>
</section>
