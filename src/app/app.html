<app-site-header />

<main id="top">
  <app-hero-section />
  <app-collection-catalog id="catalogue" [collections]="collections" />
  <app-category-feature
    id="femme"
    titleId="women-title"
    eyebrow="Jeynamandaa présente"
    title="L’edit Baaxantal"
    [image]="collections[5].image"
    [imageAlt]="collections[5].imageAlt"
    [categories]="womenCategories"
  />
  <section class="bg-white px-5 py-14" aria-labelledby="edit-baaxantal-title">
    <div class="mx-auto mb-10 max-w-[92rem] text-left">
      <h2 id="edit-baaxantal-title" class="font-serif text-[clamp(3rem,7vw,6rem)] font-normal italic leading-none">
        L’edit Baaxantal
      </h2>
    </div>

    <div class="mx-auto grid max-w-[92rem] gap-14">
      @for (gallery of editorialCollections; track gallery.id) {
        <article>
          <div class="mb-5 flex items-end justify-between gap-4">
            <div>
              <p class="mb-1 text-[10px] font-extrabold uppercase tracking-[0.16em] text-black/45">Collection</p>
              <h3 class="font-serif text-[clamp(2rem,4vw,3.75rem)] font-normal leading-none">{{ gallery.name }}</h3>
            </div>
          </div>
          <div
            class="relative"
            [style.width]="gallery.id === 'mosaika-gallery' || gallery.id === 'johayna-gallery' ? '100vw' : null"
            [style.margin-left]="gallery.id === 'mosaika-gallery' || gallery.id === 'johayna-gallery' ? 'min(-1.25rem, calc(46rem - 50vw))' : null"
          >
            <button
              class="absolute left-0 top-1/2 z-10 grid h-12 w-12 -translate-y-1/2 place-items-center rounded-full bg-white text-3xl leading-none shadow-[0_8px_24px_rgba(0,0,0,0.16)] transition hover:bg-black hover:text-white"
              type="button"
              [attr.aria-label]="'Voir les photos précédentes de ' + gallery.name"
              (click)="scrollGallery(gallery.id, -1)"
            >
              ‹
            </button>
            <div
              class="flex w-full snap-x gap-4 overflow-x-hidden scroll-smooth pb-4"
              [id]="gallery.id"
            >
              @for (image of gallery.images; track image; let index = $index) {
                <figure class="min-w-[78vw] snap-start bg-[#f6f6f6] sm:min-w-[22rem] lg:min-w-[28rem]">
                  <img
                    class="aspect-[3/4] h-full w-full object-cover object-top"
                    [src]="image"
                    [alt]="gallery.name + ' photo ' + (index + 1)"
                  />
                </figure>
              }
            </div>
            <button
              class="absolute right-3 top-1/2 z-10 grid h-12 w-12 -translate-y-1/2 place-items-center rounded-full bg-white text-3xl leading-none shadow-[0_8px_24px_rgba(0,0,0,0.16)] transition hover:bg-black hover:text-white"
              type="button"
              [attr.aria-label]="'Voir les photos suivantes de ' + gallery.name"
              (click)="scrollGallery(gallery.id, 1)"
            >
              ›
            </button>
          </div>
        </article>
      }
    </div>
  </section>
  <app-promo-banner />
  <app-category-feature
    id="homme"
    titleId="men-title"
    eyebrow="Nouvelle silhouette"
    title="Créateur’s Club Vol. 3"
    [image]="collections[7].image"
    [imageAlt]="collections[7].imageAlt"
    [categories]="menCategories"
  />
  <app-social-links />
  <app-service-grid [services]="services" />
</main>

<app-site-footer />
